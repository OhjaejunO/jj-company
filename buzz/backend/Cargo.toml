[package]
name = "buzz-backend-jjvps"
version = "0.2.0"
edition = "2021"

[dependencies]
serde_json = "1"
# nsec 해독. 체크섬을 직접 짜지 않는 이유는 «작게 쓰기»보다 «가장자리에서 맞기»가 먼저라서다.
bech32 = "0.11"
# secp256k1 공개키 유도(순수 러스트라 크로스 컴파일에 C 툴체인이 필요 없다).
k256 = { version = "0.13", default-features = false, features = ["arithmetic"] }
sha2 = "0.10"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
